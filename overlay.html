<!DOCTYPE html>
<!--
  Tryndamere OTP overlay (WEB version) — chat + rank + now playing
  OBS Browser Source, 1920x1080, transparent background. Hosted as a static site
  (GitHub Pages / Netlify); every path is relative, nothing runs on the PC.
  All settings can be passed as URL params (see README-WEB.md), e.g.
    overlay.html?widgets=chat,rank,song&channel=calebgcameron&font=24
    overlay.html?song=Artist%20-%20Title      (fixed song text; empty ?song= hides the strip)
  rank.json is written by the GitHub Actions workflow; song.json is edited on GitHub (phone ok).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trynd Overlay</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="verses.js"></script>
<script src="site-config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  :root{
    --steel-0:#07090d; --steel-1:#0e131b; --steel-2:#1a222e; --steel-3:#2b3646;
    --frost:#cfe3f2; --frost-dim:#8fa6b9; --ice:#7fc4ea;
    --rage:#d4141f; --rage-hot:#ff3b30; --rage-deep:#7a0a10;
    --text:#eef3f8;
    --chat-font:23px; --bg-op:0.74; --ui-scale:1;
    --sans:"Barlow Semi Condensed","Segoe UI Semibold","Segoe UI","Roboto Condensed","Arial Narrow",Arial,sans-serif;
    --serif:"Cinzel","Trajan Pro","Georgia",serif;
    --book:"Crimson Pro","Georgia","Cambria","Times New Roman",serif;
  }
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:transparent;}
  body{font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;}
  .widget{position:absolute;}
  .hidden{display:none !important;}

  /* ---------- CHAT (Twitch reader) ---------- */
  #chat{display:flex;flex-direction:column;justify-content:flex-end;gap:7px;overflow:hidden;}
  .msg{
    position:relative;
    background:linear-gradient(90deg, rgba(10,14,20,var(--bg-op)) 0%, rgba(14,19,27,calc(var(--bg-op) - .06)) 100%);
    border:1px solid rgba(143,166,185,.16);
    border-left:3px solid var(--rage);
    border-radius:4px 10px 10px 4px;
    padding:6px 12px 7px 11px;
    font-size:var(--chat-font);line-height:1.28;font-weight:500;
    text-shadow:0 1px 2px rgba(0,0,0,.9);
    word-wrap:break-word;overflow-wrap:anywhere;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    animation:msgIn .28s ease-out both;
    transition:opacity .9s ease, transform .9s ease;
  }
  .msg.mod{border-left-color:#3fb37f;}
  .msg.bc{border-left-color:var(--rage-hot);}
  .msg.vip{border-left-color:#e05fd0;}
  .msg.system{border-left-color:var(--ice);background:linear-gradient(90deg,rgba(18,40,58,var(--bg-op)),rgba(14,19,27,calc(var(--bg-op) - .06)));}
  .msg.system .sys{color:var(--frost);font-style:italic;}
  .msg.out{opacity:0;transform:translateX(24px);}
  @keyframes msgIn{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:none;}}
  .badge{display:inline-block;font-size:.56em;font-weight:700;letter-spacing:.06em;line-height:1;
    padding:3px 5px 2px;border-radius:3px;margin-right:5px;vertical-align:.28em;color:#0b0e13;text-shadow:none;}
  .badge.b-bc{background:var(--rage-hot);color:#fff;}
  .badge.b-mod{background:#3fb37f;}
  .badge.b-vip{background:#e05fd0;}
  .badge.b-sub{background:var(--ice);}
  .name{font-weight:700;}
  .colon{color:var(--frost-dim);margin-right:.34em;}
  .text.action{font-style:italic;margin-left:.3em;}
  .emote{height:1.35em;vertical-align:-.32em;margin:0 1px;}

  /* ---------- CHAT (Restream iframe frame) ---------- */
  #rframe{
    border-radius:12px;overflow:hidden;
    background:rgba(8,11,16,var(--bg-op));
    border:1px solid rgba(143,166,185,.22);
    box-shadow:0 8px 28px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.4);
  }
  #rframe::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--rage-hot),var(--rage-deep));z-index:2;}
  #rframe .rhead{height:30px;display:flex;align-items:center;gap:8px;padding:0 14px;
    font-family:var(--serif);font-size:13px;letter-spacing:.2em;color:var(--frost-dim);
    background:linear-gradient(180deg,rgba(26,34,46,.9),rgba(14,19,27,.6));border-bottom:1px solid rgba(143,166,185,.14);}
  #rframe .rhead i{width:7px;height:7px;transform:rotate(45deg);background:var(--rage);display:inline-block;}
  #rframe iframe{border:0;width:100%;height:calc(100% - 31px);background:transparent;display:block;}
  #rframe .rerr{padding:16px;font-size:18px;color:var(--frost-dim);}

  /* ---------- RANK ---------- */
  #rank{transform-origin:top left;transform:scale(var(--ui-scale));}
  .rank-card{
    position:relative;display:flex;align-items:center;gap:14px;
    min-width:var(--rank-minw,300px);box-sizing:border-box;padding:12px 20px 14px 14px;
    background:linear-gradient(135deg, rgba(26,34,46,.92) 0%, rgba(10,14,20,.9) 60%, rgba(40,8,12,.88) 100%);
    border:1px solid rgba(143,166,185,.28);
    border-radius:6px 14px 6px 14px;
    box-shadow:0 8px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(207,227,242,.08);
  }
  .rank-card::after{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(207,227,242,.55),transparent);}
  .emblem{width:58px;height:58px;flex:0 0 58px;filter:drop-shadow(0 0 8px var(--tier-glow,rgba(127,196,234,.55)));}
  .rank-body{display:flex;flex-direction:column;gap:2px;}
  .otp{font-family:var(--serif);font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--rage-hot);
    text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .otp .chip{font-family:var(--sans);letter-spacing:.08em;font-size:11px;color:#0b0e13;background:#f2c14e;
    padding:1px 6px;border-radius:3px;}
  .rank-line{font-size:30px;font-weight:700;letter-spacing:.03em;line-height:1.05;color:var(--text);
    text-shadow:0 2px 6px rgba(0,0,0,.8);white-space:nowrap;}
  .rank-line .tier{color:var(--tier-col,#9fd3f5);}
  .rank-line .dot{color:var(--frost-dim);margin:0 6px;}
  .rank-line .lp{color:var(--frost);}
  .rage{height:5px;margin-top:5px;border-radius:3px;background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(0,0,0,.6);}
  .rage > b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rage-deep),var(--rage),var(--rage-hot));
    box-shadow:0 0 8px var(--rage-hot);transition:width .8s ease;}
  .today{font-size:17px;font-weight:600;color:var(--frost-dim);margin-top:3px;letter-spacing:.04em;}
  .today .w{color:#6fd49a;} .today .l{color:#ff6b6b;}

  /* ---------- SONG ---------- */
  #song{transform-origin:top left;transform:scale(var(--ui-scale));transition:opacity .5s ease;}
  .song-strip{display:inline-flex;align-items:center;gap:10px;max-width:520px;box-sizing:border-box;
    padding:7px 16px 7px 12px;border-radius:4px 12px 12px 4px;
    background:linear-gradient(90deg,rgba(10,14,20,.88),rgba(14,19,27,.78));
    border:1px solid rgba(143,166,185,.2);border-left:3px solid var(--ice);
    box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .song-strip .note{color:var(--ice);font-size:20px;line-height:1;text-shadow:0 0 8px rgba(127,196,234,.7);}
  .song-strip .st{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--frost);}

  /* ---------- QUEUE scene ---------- */
  #scenebg{position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 18% 115%, rgba(122,10,16,.55), transparent 55%),
      radial-gradient(ellipse at 88% -10%, rgba(127,196,234,.16), transparent 50%),
      linear-gradient(160deg,#0c1118 0%,#06080c 70%);}
  #scenebg::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,rgba(207,227,242,.018) 0 2px,transparent 2px 9px);}
  #scenebg.cut{ /* transparent hole where the webcam goes */
    -webkit-mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000);
    -webkit-mask-repeat:no-repeat;-webkit-mask-composite:xor;mask-composite:exclude;
    -webkit-mask-size:100% 100%,var(--cw) var(--ch);-webkit-mask-position:0 0,var(--cx) var(--cy);}
  #status .row{display:flex;align-items:center;gap:26px;}
  #status .t1{font-family:var(--serif);font-weight:700;font-size:76px;line-height:1;letter-spacing:.1em;color:var(--frost);
    text-shadow:0 4px 30px rgba(0,0,0,.8);white-space:nowrap;}
  #status .timer{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 14px;border-radius:6px;
    background:rgba(10,14,20,.85);border:1px solid rgba(143,166,185,.25);border-left:3px solid var(--rage-hot);
    font-size:34px;font-weight:700;letter-spacing:.06em;color:var(--frost);font-variant-numeric:tabular-nums;}
  #status .timer i{width:9px;height:9px;transform:rotate(45deg);background:var(--rage-hot);box-shadow:0 0 10px var(--rage-hot);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35}}
  #status .t2{font-size:26px;font-weight:600;letter-spacing:.26em;color:var(--rage-hot);text-transform:uppercase;margin-top:12px;}
  #status .bar{width:520px;height:3px;margin-top:14px;background:linear-gradient(90deg,var(--rage-hot),transparent);}

  #cam{pointer-events:none;box-sizing:border-box;border:3px solid rgba(143,166,185,.55);border-radius:4px;
    box-shadow:0 0 0 1px rgba(0,0,0,.7),0 10px 30px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.5);}
  #cam .c{position:absolute;width:26px;height:26px;border:3px solid var(--rage-hot);}
  #cam .c.tl{left:-7px;top:-7px;border-right:0;border-bottom:0}
  #cam .c.tr{right:-7px;top:-7px;border-left:0;border-bottom:0}
  #cam .c.bl{left:-7px;bottom:-7px;border-right:0;border-top:0}
  #cam .c.br{right:-7px;bottom:-7px;border-left:0;border-top:0}
  #cam .tag{position:absolute;left:14px;bottom:-15px;padding:3px 10px;font-family:var(--serif);font-size:13px;font-weight:700;letter-spacing:.22em;
    color:var(--frost);background:#0b0f15;border:1px solid rgba(143,166,185,.35);border-radius:3px;}
  #cam .demo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(45deg,#232b35 0 14px,#1c232c 14px 28px);
    color:rgba(220,228,236,.75);font-size:22px;letter-spacing:.2em;text-transform:uppercase;}

  .panel{box-sizing:border-box;border-radius:10px;
    background:linear-gradient(160deg,rgba(26,34,46,.78),rgba(10,14,20,.82));
    border:1px solid rgba(143,166,185,.22);box-shadow:0 10px 30px rgba(0,0,0,.45);}
  .panel .ph{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:.26em;color:var(--frost-dim);}
  .panel .ph i{width:7px;height:7px;transform:rotate(45deg);background:var(--rage);display:inline-block;}

  #info{padding:16px 22px;}
  #info .tw{font-size:30px;font-weight:700;letter-spacing:.02em;color:var(--frost);}
  #info .tw b{color:#b18cff;font-weight:700;}
  #info .sch{margin-top:6px;font-size:21px;font-weight:600;color:var(--frost-dim);letter-spacing:.05em;}
  #info .sch em{font-style:normal;color:var(--rage-hot);}
  #socials{display:flex;gap:14px;}
  #socials .s{display:flex;align-items:center;gap:9px;padding:7px 14px;border-radius:6px;background:rgba(10,14,20,.8);
    border:1px solid rgba(143,166,185,.2);font-size:20px;font-weight:600;color:var(--frost);}
  #socials .s span{font-size:13px;font-weight:700;letter-spacing:.14em;color:#0b0e13;background:var(--frost-dim);padding:2px 6px;border-radius:3px;}

  #cpanel .ph{position:absolute;left:18px;top:14px;}
  body.queue{--rank-minw:400px;}
  body.queue .song-strip{width:400px;max-width:400px;}

  /* ---------- VERSE ---------- */
  #verse{display:flex;flex-direction:column;padding:18px 28px 16px;overflow:hidden;}
  #verse::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:linear-gradient(180deg,var(--ice),rgba(127,196,234,0));}
  #verse .vt{flex:1 1 auto;min-height:0;display:flex;align-items:center;overflow:hidden;}
  #verse .vt p{margin:0;font-family:var(--book);font-weight:500;line-height:1.3;color:#f1f5f9;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #verse .vt p::before{content:"\201C";color:var(--ice);margin-right:.08em;}
  #verse .vt p::after{content:"\201D";color:var(--ice);margin-left:.04em;}
  #verse .vf{display:flex;align-items:center;gap:12px;margin-top:10px;}
  #verse .vref{font-family:var(--serif);font-weight:700;letter-spacing:.14em;color:var(--frost);font-size:20px;}
  #verse .vtr{font-size:12px;font-weight:700;letter-spacing:.14em;color:#0b0e13;background:var(--ice);padding:2px 7px;border-radius:3px;}
  #verse.small{padding:10px 16px 10px 18px;}
  #verse.small .ph{font-size:11px;}
  #verse.small .vref{font-size:14px;}
  #verse.small .vtr{font-size:10px;}
  #verse.small .vf{margin-top:6px;}

  #debug{position:absolute;left:8px;bottom:8px;font:14px monospace;color:#9fe;background:rgba(0,0,0,.7);padding:4px 8px;}
</style>
</head>
<body>
<div id="scenebg" class="hidden"></div>
<div id="status" class="widget hidden"><div class="row"><div class="t1"></div><div class="timer hidden"><i></i><span class="tv">0:00</span></div></div><div class="t2"></div><div class="bar"></div></div>
<div id="cam" class="widget hidden"><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div></div>
<div id="info" class="widget panel hidden"><div class="tw"></div><div class="sch"></div></div>
<div id="socials" class="widget hidden"></div>
<div id="verse" class="widget panel hidden"><div class="ph"><i></i>VERSE OF THE DAY</div><div class="vt"><p></p></div><div class="vf"><span class="vref"></span><span class="vtr">WEB</span></div></div>
<div id="cpanel" class="widget panel hidden"><div class="ph"><i></i>LIVE CHAT</div></div>
<div id="chat" class="widget hidden"></div>
<div id="rframe" class="widget hidden"><div class="rhead"><i></i>CHAT</div></div>
<div id="rank" class="widget hidden"></div>
<div id="song" class="widget hidden"><div class="song-strip"><span class="note">&#9834;</span><span class="st"></span></div></div>
<div id="debug" class="hidden"></div>

<script>
/* ======================= DEFAULTS (site-wide overrides go in site-config.js) ======================= */
const DEFAULTS = {
  widgets: "chat,rank",
  layout: "game",            // "game" (in-game HUD-safe) or "queue" (between games scene)
  channel: "calebgcameron",  // Twitch channel (lowercase)
  chat: "twitch",            // "twitch" (built-in anonymous reader) or "restream"
  restream_url: "",          // Restream Chat "Embed in stream" URL (only for chat=restream)
  font: 23,                  // chat font size in px
  max: 8,                    // max chat messages on screen
  fade: 45,                  // seconds before a message fades out (0 = never)
  opacity: 0.74,             // chat backing opacity 0..1
  badges: 1, hidebots: 1, hidecmds: 0, emotes: 1,
  data: "",                  // where rank.json/song.json live. "" = same folder as this page (GitHub Pages).
                             // Netlify: set in site-config.js to https://raw.githubusercontent.com/USER/REPO/main/
  rankfile: "rank.json", rankpoll: 60,   // rank.json is refreshed by GitHub Actions ~every 15 min
  songfile: "song.json", songpoll: 30,   // song.json: {"song": "Artist - Title"} ("" = hide). Plain .txt also works.
  // song: "..."             // URL param only: ?song=Artist%20-%20Title fixes the text (empty = hidden), no polling
  scale: 1,                  // scale for rank + song widgets
  // ---- queue scene (layout=queue / queue.html) ----
  status: "queue",           // queue | champ | back | starting   (or set title=/subtitle= yourself)
  title: "", subtitle: "",   // override the status text
  timer: 0,                  // 1 = count-up timer next to the title (resets when the scene becomes active in OBS)
  scenebg: 1,                // 1 = dark Freljord backdrop (with a transparent webcam hole), 0 = fully transparent
  cam: 1,                    // 1 = webcam frame (put your camera source BEHIND it, see README for coords)
  twitch: "twitch.tv/CalebGCameron",
  schedule: "7:30pm Sydney time",
  x_handle: "@calebcameron_",  // empty = hidden
  tiktok: "@calebcameron_",
  youtube: "@lebthetapdancer",
  // ---- verse of the day (always on in queue scene; add "verse" to widgets for the game overlay) ----
  verse: 1,                  // queue scene: 1 = show verse panel, 0 = hide
  verse_ref: "",             // force a specific verse, e.g. "Isaiah 40:31"
  verse_date: "",            // testing only: pretend it's this date (YYYY-MM-DD)
  demo: 0, debug: 0
};
/* Layout presets (1920x1080). Chat box = x,y,w,h. Chat stacks upward from the bottom of its box. */
const LAYOUTS = {
  game:  { x:1490, y:150, w:410, h:480,  rankx:24, ranky:24,  songx:24, songy:146, scale:1,    max:8,
           verse:{x:24, y:204, w:470, h:170} },
  // queue: x,y,w,h = the chat PANEL (messages sit inside it)
  queue: { x:1360, y:56,  w:500, h:968,  rankx:760, ranky:222, songx:760, songy:394, scale:1.35, max:16,
           status:{x:80, y:56}, cam:{x:80, y:222, w:640, h:360}, info:{x:760, y:470, w:540, h:112},
           verse:{x:80, y:622, w:1220, h:320}, socials:{x:80, y:970} }
};
/* ============================================================================================= */
// site-config.js may override any DEFAULTS key for the whole site (e.g. data, channel, schedule)
if (window.SITE_CONFIG && typeof window.SITE_CONFIG === "object") {
  for (const k of Object.keys(window.SITE_CONFIG)) if (k in DEFAULTS) DEFAULTS[k] = window.SITE_CONFIG[k];
}

const qs = new URLSearchParams(location.search);
const P = (k) => qs.has(k) ? qs.get(k) : DEFAULTS[k];
const N = (k, d) => { const v = parseFloat(P(k)); return Number.isFinite(v) ? v : d; };
const B = (k) => { const v = String(P(k)); return v === "1" || v === "true" || v === "yes"; };

const layoutName = (P("layout") === "queue") ? "queue" : "game";
const L = Object.assign({}, LAYOUTS[layoutName]);
const widgets = String(P("widgets")).toLowerCase().split(/[,\s]+/).filter(Boolean);
const only = widgets.length === 1 ? widgets[0] : null;
// position params: x,y,w,h = chat (or the single widget if only one is enabled); rankx/ranky/songx/songy explicit
const pos = (k, dflt) => (qs.has(k) ? N(k, dflt) : dflt);
const chatBox = { x: pos("x", L.x), y: pos("y", L.y), w: pos("w", L.w), h: pos("h", L.h) };
const rankPos = { x: pos("rankx", only === "rank" ? pos("x", L.rankx) : L.rankx), y: pos("ranky", only === "rank" ? pos("y", L.ranky) : L.ranky) };
const songPos = { x: pos("songx", only === "song" ? pos("x", L.songx) : L.songx), y: pos("songy", only === "song" ? pos("y", L.songy) : L.songy) };

const DEMO = B("demo"), DEBUG = B("debug");
const root = document.documentElement.style;
root.setProperty("--chat-font", N("font", 23) + "px");
root.setProperty("--bg-op", Math.min(1, Math.max(0, N("opacity", 0.74))));
root.setProperty("--ui-scale", qs.has("scale") ? N("scale", 1) : L.scale);

const $ = (id) => document.getElementById(id);
const dbg = (s) => { if (!DEBUG) return; const d = $("debug"); d.classList.remove("hidden"); d.textContent = s; };
window.__overlay = { status: "init", joined: false, messages: 0, errors: [] };

function place(el, p, withSize) {
  el.style.left = p.x + "px"; el.style.top = p.y + "px";
  if (withSize) { el.style.width = p.w + "px"; el.style.height = p.h + "px"; }
  el.classList.remove("hidden");
}

/* ---------------- QUEUE scene ---------------- */
const STATUS = {
  queue:    ["IN QUEUE",      "Tryndamere OTP · finding the next game"],
  champ:    ["CHAMP SELECT",  "Locking in Tryndamere"],
  back:     ["BACK SOON",     "Grab a drink · back in a sec"],
  starting: ["STARTING SOON", "Rage is building"]
};
const STATUS_ALIAS = { inqueue:"queue", q:"queue", champselect:"champ", select:"champ", cs:"champ", brb:"back", backsoon:"back", away:"back", startingsoon:"starting", start:"starting", soon:"starting" };
let timerStart = Date.now();
window.addEventListener("message", (e) => { if (e.data && e.data.type === "obsActive" && e.data.active) timerStart = Date.now(); });
window.addEventListener("obsSourceActiveChanged", (e) => { if (e.detail && e.detail.active) timerStart = Date.now(); });
function fmtTime(ms) {
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}
function startQueueScene() {
  const Q = L;
  document.body.classList.add("queue");
  // status + timer
  let key = String(P("status") || "queue").toLowerCase().replace(/[^a-z]/g, "");
  key = STATUS[key] ? key : (STATUS_ALIAS[key] || "queue");
  const st = $("status");
  st.querySelector(".t1").textContent = P("title") || STATUS[key][0];
  st.querySelector(".t2").textContent = P("subtitle") || STATUS[key][1];
  place(st, Q.status, false);
  if (B("timer")) {

function safeColor(c, name) {
  let col = /^#[0-9a-f]{6}$/i.test(c || "") ? c : null;
  if (!col) { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0; col = PALETTE[h % PALETTE.length]; }
  // lift very dark colours so they're readable on the dark backing
  let r = parseInt(col.slice(1,3),16), g = parseInt(col.slice(3,5),16), b = parseInt(col.slice(5,7),16);
  const lum = 0.2126*r + 0.7152*g + 0.0722*b;
  if (lum < 110) { const k = (110 - lum) / 255 + 0.35; r = Math.round(r + (255-r)*k); g = Math.round(g + (255-g)*k); b = Math.round(b + (255-b)*k); }
  return `rgb(${r},${g},${b})`;
}

function parseTags(s) {
  const t = {};
  if (!s) return t;
  for (const kv of s.split(";")) {
    const i = kv.indexOf("="); const k = i < 0 ? kv : kv.slice(0, i); let v = i < 0 ? "" : kv.slice(i + 1);
    v = v.replace(/\\s/g, " ").replace(/\\:/g, ";").replace(/\\r/g, "").replace(/\\n/g, "").replace(/\\\\/g, "\\");
    t[k] = v;
  }
  return t;
}
function parseLine(line) {
  // [@tags] [:prefix] COMMAND [params] [:trailing]
  let p = 0, tags = {}, prefix = "", cmd = "", params = [], trailing = null;
  if (line[0] === "@") { const e = line.indexOf(" "); tags = parseTags(line.slice(1, e)); p = e + 1; }
  if (line[p] === ":") { const e = line.indexOf(" ", p); prefix = line.slice(p + 1, e); p = e + 1; }
  const ti = line.indexOf(" :", p - 1);
  let mid = ti >= 0 ? line.slice(p, ti) : line.slice(p);
  if (ti >= 0) trailing = line.slice(ti + 2);
  const parts = mid.trim().split(" "); cmd = parts.shift(); params = parts;
  return { tags, prefix, cmd, params, trailing, nick: prefix.split("!")[0] };
}

// Build message text as DOM nodes (never innerHTML) with Twitch emote images from the "emotes" tag.
function buildText(container, text, emotesTag) {
  const chars = Array.from(text);               // Twitch emote ranges index by code point
  const ranges = [];
  if (B("emotes") && emotesTag) {
    for (const part of emotesTag.split("/")) {
      const [id, locs] = part.split(":");
      if (!id || !locs || !/^[A-Za-z0-9_]+$/.test(id)) continue;
      for (const loc of locs.split(",")) {
        const [a, b] = loc.split("-").map(Number);
        if (Number.isInteger(a) && Number.isInteger(b) && a <= b && b < chars.length) ranges.push({ a, b, id });
      }
    }
    ranges.sort((m, n) => m.a - n.a);
  }
  let i = 0;
  for (const r of ranges) {
    if (r.a < i) continue;
    if (r.a > i) container.appendChild(document.createTextNode(chars.slice(i, r.a).join("")));
    const img = document.createElement("img");
    img.className = "emote"; img.alt = chars.slice(r.a, r.b + 1).join("");
    img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/1.0`;
    img.onerror = () => img.replaceWith(document.createTextNode(img.alt));
    container.appendChild(img);
    i = r.b + 1;
  }
  if (i < chars.length) container.appendChild(document.createTextNode(chars.slice(i).join("")));
}

function startTwitch(channel) {
  channel = String(channel || "").toLowerCase().replace(/^#/, "").replace(/[^a-z0-9_]/g, "");
  if (!channel) { window.__overlay.status = "no-channel"; dbg("no channel"); return; }
  let ws, backoff = 1000, pingTimer = null, lastData = Date.now();
  const connect = () => {
    window.__overlay.status = "connecting"; dbg("connecting #" + channel);
    ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    ws.onopen = () => {
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + (10000 + Math.floor(Math.random() * 89999)));
      ws.send("JOIN #" + channel);
      window.__overlay.status = "open";
    };
    ws.onmessage = (ev) => {
      lastData = Date.now();
      for (const line of String(ev.data).split("\r\n")) {
        if (!line) continue;
        if (line.startsWith("PING")) { ws.send("PONG" + line.slice(4)); continue; }
        const m = parseLine(line);
        switch (m.cmd) {
          case "001": backoff = 1000; break;
          case "366": case "ROOMSTATE":
            if (!window.__overlay.joined) { window.__overlay.joined = true; window.__overlay.status = "joined"; dbg("joined #" + channel); }
            break;
          case "PRIVMSG": {
            const name = m.tags["display-name"] || m.nick;
            const login = (m.nick || "").toLowerCase();
            const text = m.trailing || "";
            if (B("hidebots") && BOTS.has(login)) break;
            if (B("hidecmds") && text.startsWith("!")) break;
            addMessage({ name, color: m.tags.color, text, emotes: m.tags.emotes, badges: m.tags.badges, id: m.tags.id, userId: m.tags["user-id"] });
            break;
          }
          case "USERNOTICE": {
            const sys = m.tags["system-msg"] || "";
            if (sys) addMessage({ system: sys, name: m.tags["display-name"], color: m.tags.color, text: m.trailing || "", emotes: m.tags.emotes, badges: m.tags.badges, id: m.tags.id });
            break;
          }
          case "CLEARCHAT": // ban/timeout (or full clear)
            if (!chatEl) break;
            if (m.tags["target-user-id"]) chatEl.querySelectorAll(`.msg[data-user="${CSS.escape(m.tags["target-user-id"])}"]`).forEach(e => e.remove());
            else chatEl.innerHTML = "";
            break;
          case "CLEARMSG":
            if (chatEl && m.tags["target-msg-id"]) chatEl.querySelectorAll(`.msg[data-id="${CSS.escape(m.tags["target-msg-id"])}"]`).forEach(e => e.remove());
            break;
          case "RECONNECT": try { ws.close(); } catch (e) {} break;
          case "NOTICE": window.__overlay.errors.push(m.trailing); dbg("NOTICE: " + m.trailing); break;
        }
      }
    };
    ws.onclose = () => {
      window.__overlay.joined = false; window.__overlay.status = "reconnecting";
      dbg("disconnected, retry in " + backoff / 1000 + "s");
      setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 30000);
    };
    ws.onerror = () => { window.__overlay.errors.push("ws error"); };
  };
  connect();
  // watchdog: Twitch PINGs ~every 5 min; if nothing for 7 min, force reconnect
  pingTimer = setInterval(() => { if (Date.now() - lastData > 420000 && ws) { try { ws.close(); } catch (e) {} } }, 30000);
}

// Resolve data files relative to the "data" base (default: this page's folder). Only http(s) bases are used.

function parseSong(txt) {
  const raw = String(txt || "").trim();
  if (!raw) return "";
  if (raw[0] === "{") {
    try {
      const d = JSON.parse(raw);
      if (d && typeof d === "object") {
        if (d.show === false) return "";
        if (typeof d.song === "string") return d.song;
        const a = typeof d.artist === "string" ? d.artist.trim() : "", t = typeof d.title === "string" ? d.title.trim() : "";
        return a && t ? a + " - " + t : (a || t);
      }
    } catch (e) { window.__overlay.errors.push("song.json: " + e.message); return null; } // keep last text on a typo
    return "";
  }
  return raw;
}

function sydneyDateKey() {
  const forced = String(P("verse_date") || "");
  if (/^\d{4}-\d{2}-\d{2}$/.test(forced)) return forced;
  // en-CA formats as YYYY-MM-DD; the date is taken in Sydney time no matter where the PC clock is set
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Australia/Sydney", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}
const normRef = (r) => String(r || "").toLowerCase().replace(/^psalms\b/, "psalm").replace(/[^a-z0-9:\-]/g, "");
const prettyRef = (r) => String(r || "").replace(/^Psalms (\d+:)/, "Psalm $1");
function gcd(a, b) { while (b) [a, b] = [b, a % b]; return a; }
function pickVerse(key) {
  const V = window.VERSES || [];
  if (!V.length) return null;
  const [y, m, d] = key.split("-").map(Number);
  const day = Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  let stride = 97; while (gcd(stride, V.length) !== 1) stride++;      // walks through every verse before repeating
  return V[((day * stride) % V.length + V.length) % V.length];
}
function fitVerse() {
  const el = $("verse"), p = el.querySelector(".vt p"), box = el.querySelector(".vt");
  const small = el.classList.contains("small");
  let size = small ? 21 : 40; const min = small ? 12 : 18;
  p.style.fontSize = size + "px";
  while (size > min && (p.scrollHeight > box.clientHeight || p.scrollWidth > box.clientWidth)) { size -= 1; p.style.fontSize = size + "px"; }
}
function showVerse(v) {
  const el = $("verse");
  if (!v) { el.classList.add("hidden"); return; }
  el.querySelector(".vt p").textContent = v.text;
  el.querySelector(".vref").textContent = prettyRef(v.ref).toUpperCase();
  el.querySelector(".vtr").textContent = v.translation || "WEB";
  el.classList.remove("hidden");
  fitVerse();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitVerse);
}
async function startVerse() {
  const el = $("verse");
  const box = layoutName === "queue" ? L.verse : { x: pos("versex", L.verse.x), y: pos("versey", L.verse.y), w: pos("versew", L.verse.w), h: pos("verseh", L.verse.h) };
  if (layoutName !== "queue") el.classList.add("small");
  place(el, box, true); el.classList.add("hidden");
  const forced = String(P("verse_ref") || "").trim();
  if (forced) {
    const hit = (window.VERSES || []).find(v => normRef(v.ref) === normRef(forced));
    if (hit) return showVerse(hit);
    try { // not in the local list: try bible-api.com (needs internet), WEB translation
      const r = await fetch("https://bible-api.com/" + encodeURIComponent(forced) + "?translation=web");
      const d = await r.json();
      if (d && d.text) return showVerse({ ref: d.reference, text: d.text.replace(/\s+/g, " ").trim(), translation: "WEB" });
    } catch (e) { window.__overlay.errors.push("verse_ref: " + e.message); }
    return showVerse(null);
  }
  let key = sydneyDateKey();
  showVerse(pickVerse(key));
  window.__overlay.verseKey = key;
  setInterval(() => { const k = sydneyDateKey(); if (k !== key) { key = k; window.__overlay.verseKey = k; showVerse(pickVerse(k)); } }, 30000);
}

/* ======================= BOOT ======================= */
if (widgets.includes("chat")) {
  const mode = String(P("chat")).toLowerCase();
  if (mode === "restream") startRestream(P("restream_url"));
  else {
    chatEl = $("chat");
    if (layoutName === "queue") {
      place($("cpanel"), chatBox, true);
      place(chatEl, { x: chatBox.x + 14, y: chatBox.y + 46, w: chatBox.w - 28, h: chatBox.h - 60 }, true);
    } else place(chatEl, chatBox, true);
    if (DEMO) demoChat(); else startTwitch(P("channel"));
  }
}
if (widgets.includes("rank")) startRank();
if (widgets.includes("song")) startSong();
if (widgets.includes("verse")) startVerse();
</script>
