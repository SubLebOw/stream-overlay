# Publishes the repo (as-is, no build step) to GitHub Pages.
# Runs on every push to main (e.g. editing song.json on your phone) and when update-rank.yml changes rank.json.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # a newer song/rank change replaces an older deploy that's still waiting

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
